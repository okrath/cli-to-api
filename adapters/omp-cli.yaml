id: "omp-cli"
name: "Open Multi-Model Prompt CLI"
version: "1.0.0"
executable: "omp"
execution_mode: "pipe"

models:
  - id: "omp-fast"
    name: "OMP Fast Worker"
    tier: "low"
    context_window: 64000
    cost_weight: 1
    is_default: true
  - id: "omp-reasoning"
    name: "OMP Reasoning Core"
    tier: "high"
    context_window: 128000
    cost_weight: 4
    is_default: false

invocation:
  args_template:
    - "--model"
    - "{model}"
    - "-q"
    - "{prompt}"
  args_template_file:
    - "--model"
    - "{model}"
    - "--file"
    - "{prompt_file}"
  prompt_transport: "auto"
  prompt_threshold_chars: 4000
  working_dir_template: "{account_dir}/workspace"
  timeout_seconds: 300

environment_isolation:
  home_dir_override: true
  xdg_override: true
  env_overrides: {}

output_parser:
  type: "regex_stream"
  strip_ansi: true
  resolve_carriage_return: true
  chunk_regex: "(?s)(.*)"

error_handling:
  rate_limit_patterns:
    - pattern: "throttled: retry in (\\d+s|\\d+m)"
      cooldown_seconds_default: 1800
      dynamic_extractor: true

concurrency:
  max_concurrent_per_account: 2
