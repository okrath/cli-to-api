id: "grok-cli"
name: "xAI Grok CLI"
version: "1.0.0"
executable: "grok"
execution_mode: "pipe"

models:
  - id: "grok-2"
    name: "Grok 2 (Balanced Intelligence)"
    tier: "medium"
    context_window: 128000
    cost_weight: 2
    is_default: true
  - id: "grok-fast"
    name: "Grok Fast (Speed & Efficiency)"
    tier: "low"
    context_window: 128000
    cost_weight: 1
    is_default: true

invocation:
  args_template:
    - "chat"
    - "--model"
    - "{model}"
    - "{prompt}"
  args_template_file:
    - "chat"
    - "--model"
    - "{model}"
    - "--prompt-file"
    - "{prompt_file}"
  prompt_transport: "auto"
  prompt_threshold_chars: 4000
  working_dir_template: "{account_dir}/workspace"
  timeout_seconds: 300

environment_isolation:
  home_dir_override: true
  xdg_override: true
  env_overrides:
    GROK_TELEMETRY: "0"

output_parser:
  type: "regex_stream"
  strip_ansi: true
  resolve_carriage_return: true
  chunk_regex: "(?s)(.*)"

error_handling:
  rate_limit_patterns:
    - pattern: "rate limit exceeded|resets in (\\d+m|\\d+h)"
      cooldown_seconds_default: 900
      dynamic_extractor: true

concurrency:
  max_concurrent_per_account: 1
